version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: github_api_db
    environment:
      POSTGRES_DB: github_repos
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app_network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: github_api
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD}@postgres:5432/github_repos
      DB_PASSWORD: ${DB_PASSWORD}
      NODE_ENV: production
      PORT: 3000
      CORS_ORIGINS: ${CORS_ORIGINS}
      LOG_LEVEL: ${LOG_LEVEL}
      LOG_RETENTION_DAYS: ${LOG_RETENTION_DAYS}
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      THROTTLE_TTL: ${THROTTLE_TTL}
      THROTTLE_LIMIT: ${THROTTLE_LIMIT}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app_network

  docs:
    image: node:20-alpine
    container_name: github_api_docs
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run docs:dev -- --host 0.0.0.0"
    environment:
      NODE_ENV: development
    networks:
      - app_network

volumes:
  postgres_data:

networks:
  app_network:
    driver: bridge
