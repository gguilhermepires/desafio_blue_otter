apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: github-api-dev
spec:
  clusterIP: None  # Headless service
  selector:
    app: kafka
  ports:
    - port: 9092
      targetPort: 9092
      name: kafka

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: github-api-dev
spec:
  serviceName: kafka
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      containers:
        - name: kafka
          image: wurstmeister/kafka:latest
          ports:
            - containerPort: 9092
              name: kafka
          env:
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "INTERNAL://kafka-0.kafka.github-api-dev.svc.cluster.local:9092"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "INTERNAL:PLAINTEXT"
            - name: KAFKA_LISTENERS
              value: "INTERNAL://0.0.0.0:9092"
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: "INTERNAL"
            - name: KAFKA_ZOOKEEPER_CONNECT
              value: "zookeeper:2181"
            - name: KAFKA_CREATE_TOPICS
              value: "repository.sync.request:1:1,repository.sync.result:1:1"
            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "true"
            # 1-day retention configuration
            - name: KAFKA_LOG_RETENTION_HOURS
              value: "24"
            - name: KAFKA_LOG_RETENTION_BYTES
              value: "2147483648"  # 2GB
            - name: KAFKA_LOG_SEGMENT_BYTES
              value: "134217728"  # 128MB
            - name: KAFKA_LOG_CLEANUP_POLICY
              value: "delete"
            - name: KAFKA_LOG_SEGMENT_DELETE_DELAY_MS
              value: "60000"
            - name: KAFKA_COMPRESSION_TYPE
              value: "gzip"
            - name: KAFKA_NUM_NETWORK_THREADS
              value: "2"
            - name: KAFKA_NUM_IO_THREADS
              value: "4"
          volumeMounts:
            - name: kafka-storage
              mountPath: /kafka
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "250m"
              memory: "512Mi"
  volumeClaimTemplates:
    - metadata:
        name: kafka-storage
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: do-block-storage
        resources:
          requests:
            storage: 3Gi
