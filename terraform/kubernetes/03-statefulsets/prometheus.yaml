apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: github-api-dev
spec:
  type: ClusterIP
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
      name: prometheus

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: prometheus
  namespace: github-api-dev
spec:
  serviceName: prometheus
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      securityContext:
        fsGroup: 65534
      initContainers:
        - name: fix-permissions
          image: busybox:latest
          command: ['sh', '-c', 'find /prometheus -type d ! -name lost+found -exec chown 65534:65534 {} + ; find /prometheus -type f -exec chown 65534:65534 {} + ; exit 0']
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: prometheus-storage
              mountPath: /prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:latest
          securityContext:
            runAsUser: 65534
          args:
            - '--config.file=/etc/prometheus/prometheus.yml'
            - '--storage.tsdb.path=/prometheus'
            - '--storage.tsdb.retention.time=1d'  # 1-day retention
            - '--storage.tsdb.retention.size=2GB'  # Max 2GB
            - '--web.console.libraries=/etc/prometheus/console_libraries'
            - '--web.console.templates=/etc/prometheus/consoles'
            - '--web.enable-lifecycle'
            - '--web.external-url=http://138.197.49.129/prometheus'
            - '--web.route-prefix=/prometheus'
          ports:
            - containerPort: 9090
              name: prometheus
          volumeMounts:
            - name: prometheus-storage
              mountPath: /prometheus
            - name: prometheus-config
              mountPath: /etc/prometheus
          resources:
            requests:
              cpu: "150m"
              memory: "384Mi"
            limits:
              cpu: "150m"
              memory: "384Mi"
          livenessProbe:
            httpGet:
              path: /prometheus/-/healthy
              port: 9090
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /prometheus/-/ready
              port: 9090
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: prometheus-config
          configMap:
            name: prometheus-config
  volumeClaimTemplates:
    - metadata:
        name: prometheus-storage
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: do-block-storage
        resources:
          requests:
            storage: 3Gi
