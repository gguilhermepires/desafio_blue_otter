apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: github-api-ingress
  namespace: github-api-dev
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/use-regex: "true"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          # Prometheus - /prometheus path
          - path: /prometheus(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: prometheus
                port:
                  number: 9090

          # Kafka UI - /kafka-ui path
          - path: /kafka-ui(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: kafka-ui
                port:
                  number: 8080

          # API - Root path (MUST be last as it's a catch-all)
          - path: /()(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: api
                port:
                  number: 3000
