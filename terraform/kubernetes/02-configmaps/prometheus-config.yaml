apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: github-api-dev
data:
  prometheus.yml: |
    global:
      scrape_interval: 60s      # 1 minute (reduce data volume)
      evaluation_interval: 60s
      external_labels:
        monitor: 'github-api-monitor'
        environment: 'development'

    scrape_configs:
      # Prometheus self-monitoring
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']

      # NestJS Application metrics
      - job_name: 'nestjs-app'
        metrics_path: '/metrics'
        static_configs:
          - targets: ['api:3000']
            labels:
              service: 'github-api'
              environment: 'development'

      # PostgreSQL Database metrics
      - job_name: 'postgres'
        static_configs:
          - targets: ['postgres-exporter:9187']
            labels:
              service: 'postgres'
              database: 'github_repos'

      # Node Exporter for system metrics
      - job_name: 'node-exporter'
        static_configs:
          - targets: ['node-exporter:9100']
            labels:
              service: 'system'
